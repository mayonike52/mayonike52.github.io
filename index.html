<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sughosh Desai — Robotics & Embedded Systems</title>
  <meta name="description" content="Sughosh Desai — Nanotechnology Engineering at the University of Waterloo. Robots, embedded systems and TinyML." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='5' y='8' width='22' height='17' rx='5' fill='%23f4ede2' stroke='%232a2f36' stroke-width='2'/><rect x='10' y='13' width='3' height='6' rx='1.5' fill='%2337c3b2'/><rect x='19' y='13' width='3' height='6' rx='1.5' fill='%2337c3b2'/><line x1='16' y1='8' x2='16' y2='3' stroke='%232a2f36' stroke-width='2'/><circle cx='16' cy='3' r='2' fill='%23ff7a3d'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
    { "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    } }
  </script>
</head>
<body>

  <!-- boot screen -->
  <div id="boot" aria-hidden="true">
    <div class="boot-inner">
      <div class="boot-lines" id="bootLines"></div>
      <div class="boot-bar"><span id="bootBar"></span></div>
      <button class="boot-skip" id="bootSkip">skip ›</button>
    </div>
  </div>

  <!-- 3D scene -->
  <div id="scene" aria-label="Interactive 3D starship"></div>

  <!-- HUD -->
  <header class="hud-top">
    <div class="hud-name">
      <h1>SUGHOSH DESAI</h1>
      <p>Nanotechnology Engineering · University of Waterloo</p>
    </div>
    <div class="hud-actions">
      <button class="chip" id="toStandard" title="Plain scrollable version">☰ Standard view</button>
      <a class="chip chip-accent" id="resumeTop" href="resume.pdf" target="_blank" rel="noopener">Resume ↗</a>
    </div>
  </header>

  <!-- scale bar (levels) -->
  <nav id="scalebar" aria-label="Zoom level"></nav>
  <div id="levelTag"></div>
  <div id="zoomfx" aria-hidden="true"><div><b id="zoomScale"></b><span id="zoomTitle"></span></div></div>

  <nav class="hud-bottom" aria-label="Workshop sections">
    <p class="hud-hint" id="hint">Click <b>SD-01</b> to say hi · check out <b>Batmobile</b> in the arena</p>
    <div class="quicknav">
      <button data-go="about">About</button>
      <button data-go="combat" class="qn-hot">Combat bot</button>
      <button data-go="projects">Projects</button>
      <button data-go="experience">Experience</button>
      <button data-go="bio">Bio</button>
      <button data-go="skills">Skills</button>
      <button data-go="contact">Contact</button>
    </div>
  </nav>

  <div id="tooltip" role="status"></div>
  <div id="bubble"></div>
  <div id="toast"></div>

  <!-- side panel -->
  <aside id="panel" aria-hidden="true">
    <button class="panel-back" id="panelClose">← Back</button>
    <div class="panel-body" id="panelBody"></div>
  </aside>

  <!-- project modal -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal-close" id="modalClose" aria-label="Close">✕</button>
      <div class="modal-head">
        <div class="tags" id="modalTags"></div>
        <h2 id="modalTitle"></h2>
        <p id="modalDesc"></p>
      </div>
      <div class="modal-tabs" id="modalTabs"></div>
      <div class="modal-content" id="modalContent"></div>
    </div>
  </div>

  <!-- combat robotics section -->
  <section id="combat" aria-hidden="true" aria-label="Combat robotics: Batmobile">
    <div class="cb-topbar"><div class="cb-stripe"></div><button class="panel-back" id="combatClose">← Back to the ship</button></div>
    <div class="cb-wrap" id="combatBody"></div>
  </section>

  <!-- lightbox -->
  <div id="lightbox" role="dialog" aria-label="Image preview"><figure><img id="lightboxImg" alt=""><figcaption id="lightboxCap"></figcaption></figure></div>

  <!-- standard (non-3D) view -->
  <main id="standard" aria-hidden="true">
    <div class="std-bar">
      <span class="std-logo">SUGHOSH DESAI</span>
      <nav>
        <a href="#s-about">About</a><a href="#s-combat">Combat</a><a href="#s-experience">Experience</a><a href="#s-projects">Projects</a><a href="#s-bio">Bio</a><a href="#s-skills">Skills</a><a href="#s-contact">Contact</a>
        <a href="resume.pdf" target="_blank" rel="noopener">Resume ↗</a>
      </nav>
      <button class="chip chip-accent" id="to3d">◆ Enter the ship</button>
    </div>
    <div class="std-wrap" id="stdContent"></div>
  </main>

  <noscript><style>#boot{display:none}</style><p style="padding:2rem;font-family:sans-serif">This site needs JavaScript. Email: s55desai@uwaterloo.ca · github.com/mayonike52</p></noscript>

  <script type="module" src="js/main.js"></script>
</body>
</html>
